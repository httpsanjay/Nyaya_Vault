<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NyayaVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 26px;
            color: #111827;
        }

        .logo p {
            margin-top: 6px;
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        input:focus,
        button:focus,
        a:focus {
            outline: 3px solid #bfdbfe;
            outline-offset: 2px;
        }

        @media (max-width: 440px) {
            body { padding: 16px; }
            .container { width: 100%; padding: 28px 20px; }
            .logo h1 { font-size: 24px; }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>NyayaVault</h1>
        <p>Secure Digital Case Management System</p>
    </div>

    {% if form.errors %}
        <div class="error">
            Invalid username or password.
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="button">
            Login
        </button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="{% url 'register' %}">
            Register
        </a>
    </div>

</div>

</body>
</html>
