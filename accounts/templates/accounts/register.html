<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | NyayaVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 480px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 26px;
            color: #111827;
        }

        .logo p {
            margin-top: 6px;
            font-size: 14px;
            color: #6b7280;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .error {
            color: #dc2626;
            font-size: 12px;
            margin-top: 5px;
        }

        input:focus,
        select:focus,
        button:focus,
        a:focus {
            outline: 3px solid #bfdbfe;
            outline-offset: 2px;
        }

        @media (max-width: 520px) {
            body { padding: 16px; align-items: flex-start; }
            .container { width: 100%; padding: 28px 20px; }
            .row { flex-direction: column; gap: 0; }
            .logo h1 { font-size: 24px; }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>NyayaVault</h1>
        <p>Create your secure account</p>
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="row">

            <div class="form-group">
                <label>First Name</label>

                <input
                    type="text"
                    name="first_name"
                    placeholder="First name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Last Name</label>

                <input
                    type="text"
                    name="last_name"
                    placeholder="Last name"
                    required
                >
            </div>

        </div>

        <div class="form-group">
            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Choose username"
                required
            >
        </div>

        <div class="form-group">
            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="official@example.com"
                required
            >
        </div>

        <div class="form-group">
            <label>Identification Number</label>

            <input
                type="text"
                name="id_number"
                placeholder="Official ID number"
                required
            >
        </div>

        <div class="form-group">
            <label>Phone Number</label>

            <input
                type="tel"
                name="phone_number"
                placeholder="Phone number"
            >
        </div>

        <div class="form-group">
            <label>Department</label>

            <input
                type="text"
                name="department"
                placeholder="Department / Organization"
            >
        </div>

        <div class="form-group">
            <label>Designation</label>

            <input
                type="text"
                name="designation"
                placeholder="Designation"
            >
        </div>

        <div class="form-group">
            <label>Police Station</label>
            <select name="station">
                <option value="">Select police station</option>
                {% for station in form.fields.station.queryset %}
                    <option value="{{ station.pk }}">{{ station.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Lawyer Registration Number (lawyers only)</label>
            <input type="text" name="lawyer_registration_number">
        </div>

        <div class="form-group">
            <label>Court Registration Number (court users only)</label>
            <input type="text" name="court_registration_number">
        </div>

        <div class="form-group">
            <label>Role</label>

            <select name="role" required>

                <option value="">Select role</option>

                <option value="IO">
                    Investigating Officer
                </option>

                <option value="SHO">
                    Station House Officer
                </option>

                <option value="FORENSIC_OFFICER">
                    Forensic Officer
                </option>

                <option value="LAWYER">Lawyer</option>
                <option value="COURT">Court Official</option>

                <option value="PROSECUTOR">
                    Prosecutor
                </option>

                <option value="JUDGE">
                    Judge / Court Official
                </option>

            </select>
        </div>

        <div class="row">

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password1"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>

                <input
                    type="password"
                    name="password2"
                    required
                >
            </div>

        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <button type="submit" class="button">
            Create Account
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </div>

</div>

</body>
</html>
