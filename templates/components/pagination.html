{% if page_obj and page_obj.paginator.num_pages > 1 %}
    <div class="pagination" style="display:flex; gap:8px; flex-wrap: wrap; align-items:center; justify-content:center; margin-top:24px;">
        {% if page_obj.has_previous %}
            <a class="btn btn-secondary btn-sm" href="?page={{ page_obj.previous_page_number }}">Previous</a>
        {% endif %}

        {% for num in page_obj.paginator.page_range %}
            {% if page_obj.number == num %}
                <span class="badge badge-info">{{ num }}</span>
            {% else %}
                <a class="btn btn-secondary btn-sm" href="?page={{ num }}">{{ num }}</a>
            {% endif %}
        {% endfor %}

        {% if page_obj.has_next %}
            <a class="btn btn-secondary btn-sm" href="?page={{ page_obj.next_page_number }}">Next</a>
        {% endif %}
    </div>
{% endif %}
